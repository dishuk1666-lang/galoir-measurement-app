<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GALOIR | Measurement Studio</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#25231f;background:#f6f4f0}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:235px;background:#211f1d;color:#f9f5ed;padding:28px 16px}aside h1{font-family:Georgia,serif;letter-spacing:4px;font-size:26px;text-align:center;margin:8px 0 4px}aside small{display:block;text-align:center;color:#b5aa9b;letter-spacing:2px;font-size:10px;margin-bottom:38px}nav button{width:100%;border:0;background:transparent;color:#cfc7bd;text-align:left;padding:14px 16px;border-radius:9px;margin:3px 0}nav button.active,nav button:hover{background:#3c3732;color:white}main{margin-left:235px;padding:32px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:2px;color:#8a7354;text-transform:uppercase}h2{font-family:Georgia,serif;font-weight:normal;font-size:32px;margin:6px 0}h3{font-size:17px;margin:0 0 18px}.btn{background:#2b2925;color:white;border:0;padding:12px 17px;border-radius:8px}.btn.secondary{background:white;color:#25231f;border:1px solid #d9d3c9}.btn:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:white;border:1px solid #e8e2d9;border-radius:13px;padding:20px;box-shadow:0 2px 12px #00000004}.metric{font-family:Georgia,serif;font-size:33px;margin:9px 0}.muted{color:#817b72;font-size:13px}.two{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:18px}.section{margin-top:22px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.listitem{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eee8df;gap:12px}.listitem:last-child{border-bottom:0}.pill{border-radius:99px;padding:5px 9px;background:#f2eee8;color:#645747;font-size:11px;white-space:nowrap}.pill.ready,.pill.delivered{background:#e7f2e8;color:#2c6843}.pill.overdue{background:#fae8e4;color:#a74435}.pill.stitching{background:#fff1dc;color:#966324}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;color:#655e55;font-weight:600}input,select,textarea{width:100%;padding:11px;border:1px solid #dcd5cc;border-radius:8px;background:#fff;color:#25231f;min-width:0}textarea{min-height:72px;resize:vertical}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.fields.twofields{grid-template-columns:repeat(2,1fr)}.search{max-width:390px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{color:#8a8278;font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}td,th{padding:14px 11px;border-bottom:1px solid #eee8e0}tr:hover td{background:#fbf9f6}.link{border:0;background:none;color:#795b34;text-decoration:underline;cursor:pointer}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day{border:1px solid #e8e1d8;border-radius:9px;padding:12px 6px;min-height:94px;background:white;text-align:center}.day:hover{border-color:#997a4e}.day.selected{outline:2px solid #9b784b}.day.full{background:#f8eeec}.day.blank{border:0;background:transparent}.day strong{display:block;font-size:17px;margin:5px}.day span{font-size:10px;color:#7b7266}.day b{font-size:11px;color:#326c4b}.day.full b{color:#a74435}.weekday{text-align:center;color:#827b71;font-size:11px;padding:10px 0}.hidden{display:none!important}.actions{display:flex;gap:9px;flex-wrap:wrap}.notice{background:#f9f2e7;border:1px solid #e7d5ba;padding:13px;border-radius:8px;font-size:13px}.small{font-size:12px}.empty{color:#817a70;padding:24px;text-align:center}.logo{color:#ae916c}.mobilehead{display:none}@media(max-width:1050px){aside{width:185px}main{margin-left:185px;padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:700px){aside{position:sticky;top:0;width:100%;height:auto;padding:9px 10px;z-index:5;display:flex;align-items:center;overflow:auto}aside h1{font-size:17px;margin:0 12px 0 4px}aside small{display:none}nav{display:flex}nav button{font-size:12px;padding:10px;white-space:nowrap;margin:0}main{margin:0;padding:18px}.top{align-items:flex-start}.top h2{font-size:25px}.fields,.fields.twofields{grid-template-columns:repeat(2,minmax(0,1fr))}.calendar{gap:3px}.day{padding:7px 2px;min-height:73px}.day strong{font-size:14px}.day span{font-size:9px}.grid{gap:9px}.card{padding:14px}.metric{font-size:25px}}
</style></head><body><aside><h1>GALOIR</h1><small>MEASUREMENT STUDIO</small><nav id="nav"><button data-page="dashboard" class="active">◫ Dashboard</button><button data-page="customers">♙ Customers</button><button data-page="new">✎ New Booking</button><button data-page="calendar">▦ Delivery Calendar</button><button data-page="tracking">☷ Daily Tracking</button><button data-page="settings">⚙ Settings</button></nav></aside><main><div class="top"><div><div class="eyebrow">GALOIR · STORE OPERATIONS</div><h2 id="pageTitle">Dashboard</h2></div><button class="btn" onclick="go('new')">+ New Measurement</button></div><div id="content"></div></main><script>
const KEY='galoir_proto_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){};state=state||{capacity:20,customers:[],orders:[]};let page='dashboard',selectedDate=localDate(),selectedCustomer='',query='',trackingDate=localDate();const measurements=['Shoulder','Bust / Chest','Waist','Hip','Armhole','Sleeve Length','Sleeve Round','Top Length','Neck Front','Neck Back','Bottom Length','Thigh','Knee','Ankle / Mori'];const statuses=['Pending','Stitching','Trial','Alteration','Ready','Delivered'];function localDate(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function addDays(date,n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)}function pretty(d){return new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ordersOn(d){return state.orders.filter(o=>o.date===d&&o.status!=='Delivered')}function booked(d){return state.orders.filter(o=>o.date===d).length}function available(d){return Math.max(0,state.capacity-booked(d))}function status(o){return o.status!=='Delivered'&&o.date<localDate()?'overdue':o.status.toLowerCase()}function badge(o){return '<span class="pill '+status(o)+'">'+(status(o)==='overdue'?'Overdue · ':'')+safe(o.status)+'</span>'}function cname(id){return state.customers.find(c=>c.id===id)?.name||'Unknown'}function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=({dashboard:'Dashboard',customers:'Customer Profiles',new:'New Measurement & Booking',calendar:'Delivery Calendar',tracking:'Daily Delivery & Tailoring',settings:'Settings'})[p];render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function render(){let el=document.getElementById('content');el.innerHTML=({dashboard:dashboard,customers:customersPage,new:newPage,calendar:calendarPage,tracking:trackingPage,settings:settingsPage})[page]()}function orderLine(o){return `<div class="listitem"><div><b>${safe(cname(o.customerId))}</b> <span class="muted">· ${safe(o.outfit)}</span><div class="muted">${safe(o.orderNo)} · ${pretty(o.date)}</div></div>${badge(o)}</div>`}function dashboard(){let today=localDate(),todayOrders=state.orders.filter(o=>o.date===today),pending=state.orders.filter(o=>o.status!=='Delivered'),overdue=pending.filter(o=>o.date<today);return `<div class="grid"><div class="card"><div class="muted">Customers</div><div class="metric">${state.customers.length}</div><div class="muted">Saved profiles</div></div><div class="card"><div class="muted">Due Today</div><div class="metric">${todayOrders.length}</div><div class="muted">Outfits scheduled</div></div><div class="card"><div class="muted">In Progress</div><div class="metric">${pending.length}</div><div class="muted">Not yet delivered</div></div><div class="card"><div class="muted">Overdue</div><div class="metric">${overdue.length}</div><div class="muted">Require attention</div></div></div><div class="two"><div class="card"><div class="row"><h3>Today's Deliveries</h3><button class="link" onclick="go('tracking')">View all</button></div>${todayOrders.length?todayOrders.map(orderLine).join(''):'<div class="empty">No deliveries booked for today.</div>'}</div><div class="card"><div class="row"><h3>Upcoming Deliveries</h3><button class="link" onclick="go('calendar')">Calendar</button></div>${state.orders.filter(o=>o.date>today&&o.status!=='Delivered').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6).map(orderLine).join('')||'<div class="empty">No upcoming deliveries yet.</div>'}</div></div><div class="section notice">Prototype data is stored only in this browser on this device. Use Settings to reset demo data. This version is not connected to a live server.</div>`}function customersPage(){let cs=state.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(query.toLowerCase()));return `<div class="card"><div class="row"><h3>Customer Directory</h3><button class="btn secondary" onclick="go('new')">+ Add Customer</button></div><input class="search" placeholder="Search name or phone" value="${safe(query)}" oninput="query=this.value;refreshCustomerRows()"><div class="tablewrap" id="customerRows">${customerRows(cs)}</div></div>`}function customerRows(cs){return cs.length?`<table><thead><tr><th>Customer</th><th>Phone</th><th>Orders</th><th>Actions</th></tr></thead><tbody>${cs.map(c=>`<tr><td><b>${safe(c.name)}</b></td><td>${safe(c.phone)}</td><td>${state.orders.filter(o=>o.customerId===c.id).length}</td><td><button class="link" onclick="showProfile('${c.id}')">View profile</button> · <button class="link" onclick="selectedCustomer='${c.id}';go('new')">New booking</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No customers found. Create your first measurement booking.</div>'}function refreshCustomerRows(){document.getElementById('customerRows').innerHTML=customerRows(state.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(query.toLowerCase())))}function showProfile(id){let c=state.customers.find(x=>x.id===id);if(!c)return;let os=state.orders.filter(o=>o.customerId===id).sort((a,b)=>b.created.localeCompare(a.created));document.getElementById('content').innerHTML=`<div class="card"><div class="row"><div><h3>${safe(c.name)}</h3><div class="muted">${safe(c.phone)} ${c.notes?'· '+safe(c.notes):''}</div></div><button class="btn" onclick="selectedCustomer='${c.id}';go('new')">+ New Booking</button></div><div class="section"><h3>Order & Measurement History</h3>${os.length?os.map(o=>`<div class="listitem"><div><b>${safe(o.orderNo)} · ${safe(o.outfit)}</b><div class="muted">Due ${pretty(o.date)} · ${safe(o.notes||'No notes')}</div><details><summary class="small">View measurements</summary><p class="small">${Object.entries(o.measurements).filter(([k,v])=>v).map(([k,v])=>safe(k)+': '+safe(v)+' in').join(' · ')||'No values entered'}</p></details></div>${badge(o)}</div>`).join(''):'<div class="empty">No orders yet</div>'}</div><button class="btn secondary" onclick="go('customers')">← Back to customers</button></div>`}function newPage(){let c=state.customers.find(x=>x.id===selectedCustomer);let last=state.orders.filter(o=>o.customerId===selectedCustomer).sort((a,b)=>b.created.localeCompare(a.created))[0];return `<form id="bookingForm" class="card" onsubmit="submitBooking(event)"><h3>Customer Details</h3><div class="fields twofields"><label class="field">Existing Customer<select id="existing" onchange="selectExisting(this.value)"><option value="">New customer</option>${state.customers.map(x=>`<option value="${x.id}" ${x.id===selectedCustomer?'selected':''}>${safe(x.name)} · ${safe(x.phone)}</option>`).join('')}</select></label><label class="field">Customer Name<input id="name" required value="${safe(c?.name||'')}"></label><label class="field">Phone Number<input id="phone" required inputmode="tel" value="${safe(c?.phone||'')}"></label><label class="field">Customer Notes<input id="customerNotes" value="${safe(c?.notes||'')}" placeholder="Optional"></label></div><div class="section"><h3>Standard Measurements <span class="muted">(inches)</span></h3><div class="fields">${measurements.map((m,i)=>`<label class="field">${m}<input inputmode="decimal" type="number" min="0" step="0.1" name="m${i}" value="${safe(last?.measurements?.[m]||'')}" placeholder="—"></label>`).join('')}</div></div><div class="section"><h3>Outfit & Delivery</h3><div class="fields twofields"><label class="field">Order / Receipt Number<input id="orderNo" required placeholder="e.g. G-1042"></label><label class="field">Outfit Type<input id="outfit" required placeholder="e.g. Suit / Blouse / Lehenga"></label><label class="field">Delivery Date<input type="date" id="due" required min="${localDate()}" value="${selectedDate<localDate()?localDate():selectedDate}" onchange="updateAvailability()"></label><label class="field">Initial Status<select id="initialStatus">${statuses.filter(s=>s!=='Delivered').map(s=>`<option>${s}</option>`).join('')}</select></label></div><p id="availability" class="notice"></p><label class="field">Fitting / Tailoring Instructions<textarea id="notes" placeholder="Neck style, lining, fitting preferences, alterations..."></textarea></label></div><div class="section actions"><button class="btn" id="saveBooking" type="submit">Save Measurement & Book Date</button><button type="button" class="btn secondary" onclick="go('dashboard')">Cancel</button></div></form>`}function selectExisting(id){selectedCustomer=id;render()}function updateAvailability(){let d=document.getElementById('due').value,n=available(d),p=document.getElementById('availability');p.textContent=d?`${booked(d)} of ${state.capacity} slots booked · ${n} remaining`:'Choose a delivery date';document.getElementById('saveBooking').disabled=!d||n===0}function submitBooking(e){e.preventDefault();let d=document.getElementById('due').value;if(d<localDate()||available(d)<=0){alert('This delivery date is unavailable. Please select another date.');return}let phone=document.getElementById('phone').value.trim(),name=document.getElementById('name').value.trim(),c=state.customers.find(x=>x.id===selectedCustomer);if(!c){c=state.customers.find(x=>x.phone===phone);if(c&&!confirm('A customer with this phone number already exists. Add this booking to their profile?'))return}if(!c){c={id:crypto.randomUUID(),name,phone,notes:''};state.customers.push(c)}c.name=name;c.phone=phone;c.notes=document.getElementById('customerNotes').value.trim();let m={};measurements.forEach((x,i)=>m[x]=document.querySelector(`[name=m${i}]`).value);state.orders.push({id:crypto.randomUUID(),customerId:c.id,orderNo:document.getElementById('orderNo').value.trim(),outfit:document.getElementById('outfit').value.trim(),date:d,status:document.getElementById('initialStatus').value,notes:document.getElementById('notes').value.trim(),measurements:m,created:new Date().toISOString()});save();selectedCustomer='';alert('Measurement saved and delivery booked successfully.');go('tracking')}function calendarPage(){let base=new Date(selectedDate+'T12:00:00'),year=base.getFullYear(),month=base.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),cells=Array.from({length:first},()=>'<div class="day blank"></div>');for(let i=1;i<=days;i++){let d=localDate(new Date(year,month,i)),free=available(d);cells.push(`<button class="day ${d===selectedDate?'selected':''} ${!free?'full':''}" onclick="selectedDate='${d}';render()"><span>${new Date(d+'T12:00:00').toLocaleDateString('en-IN',{weekday:'short'})}</span><strong>${i}</strong><b>${free?free+' free':'Full'}</b></button>`)}return `<div class="card"><div class="row"><button class="btn secondary" onclick="changeMonth(-1)">← Prev</button><h3>${base.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h3><button class="btn secondary" onclick="changeMonth(1)">Next →</button></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div></div><div class="section card"><div class="row"><div><h3>${pretty(selectedDate)}</h3><div class="muted">${booked(selectedDate)} / ${state.capacity} delivery slots booked · ${available(selectedDate)} free</div></div><button class="btn" ${available(selectedDate)===0||selectedDate<localDate()?'disabled':''} onclick="go('new')">Book This Date</button></div>${state.orders.filter(o=>o.date===selectedDate).map(orderLine).join('')||'<div class="empty">No orders scheduled for this date.</div>'}</div>`}function changeMonth(n){let d=new Date(selectedDate+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+n);selectedDate=localDate(d);render()}function trackingPage(){let os=state.orders.filter(o=>o.date===trackingDate).sort((a,b)=>statuses.indexOf(a.status)-statuses.indexOf(b.status));let pending=state.orders.filter(o=>o.status!=='Delivered'&&o.date<trackingDate);return `<div class="card"><div class="row"><h3>Deliveries for Selected Day</h3><input style="max-width:200px" type="date" value="${trackingDate}" onchange="trackingDate=this.value;render()"></div><div class="muted">${os.length} scheduled · ${os.filter(o=>o.status==='Delivered').length} delivered · ${os.filter(o=>o.status!=='Delivered').length} outstanding</div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Order</th><th>Outfit</th><th>Status</th><th>Update Status</th></tr></thead><tbody>${os.map(o=>`<tr><td>${safe(cname(o.customerId))}</td><td>${safe(o.orderNo)}</td><td>${safe(o.outfit)}</td><td>${badge(o)}</td><td><select aria-label="Status for ${safe(o.orderNo)}" onchange="setStatus('${o.id}',this.value)">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>${os.length?'':'<div class="empty">No orders scheduled on this date.</div>'}</div></div><div class="section card"><h3>Pending Tailoring & Overdue Work</h3>${pending.length?pending.sort((a,b)=>a.date.localeCompare(b.date)).map(o=>`<div class="listitem"><div><b>${safe(cname(o.customerId))}</b> · ${safe(o.orderNo)}<div class="muted">${safe(o.outfit)} · Due ${pretty(o.date)}</div></div><div class="actions">${badge(o)}<select aria-label="Update ${safe(o.orderNo)}" onchange="setStatus('${o.id}',this.value)">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div></div>`).join(''):'<div class="empty">No overdue work before the selected date.</div>'}</div>`}function setStatus(id,s){let o=state.orders.find(x=>x.id===id);if(o){o.status=s;save();render()}}function settingsPage(){return `<div class="card"><h3>Delivery Capacity</h3><p class="muted">Each booked outfit uses one slot. A full day cannot accept additional bookings. Changing capacity does not cancel existing bookings.</p><label class="field" style="max-width:270px">Maximum Outfits Per Day<input id="capacity" type="number" min="1" max="999" value="${state.capacity}"></label><div class="section"><button class="btn" onclick="setCapacity()">Save Capacity</button></div></div><div class="section card"><h3>Data & Prototype Limitations</h3><p class="muted">Records are saved in this browser using local storage. There is no staff login, cloud sync, backup, notification service or shared multi-device database yet. Do not enter real customer information until the production backend and privacy protections are ready.</p><button class="btn secondary" onclick="resetData()">Erase Prototype Data</button></div>`}function setCapacity(){let n=Number(document.getElementById('capacity').value);if(!Number.isInteger(n)||n<1||n>999){alert('Enter a whole number between 1 and 999.');return}state.capacity=n;save();alert('Daily capacity updated.');render()}function resetData(){if(confirm('Erase all customers, measurements and orders saved in this browser? This cannot be undone.')){state={capacity:20,customers:[],orders:[]};save();selectedCustomer='';go('dashboard')}}render();</script></body></html>
