<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GALOIR | Measurement Studio</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#28231f;background:#f7f5f1}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}aside{position:fixed;inset:0 auto 0 0;width:225px;background:#24201e;color:#fff;padding:26px 15px}aside h1{font-family:Georgia,serif;text-align:center;letter-spacing:4px;font-size:27px;margin:8px 0 2px}aside small{display:block;text-align:center;color:#b5a89a;letter-spacing:2px;margin-bottom:35px;font-size:10px}nav button{width:100%;padding:13px;text-align:left;background:none;border:0;color:#ddd0c4;border-radius:8px;margin-bottom:5px}nav button.active,nav button:hover{background:#474039;color:white}main{margin-left:225px;padding:30px;max-width:1450px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:24px}.eyebrow{color:#9c815f;letter-spacing:2px;font-size:11px;text-transform:uppercase}h2{font:normal 32px Georgia,serif;margin:5px 0}h3{margin:0 0 15px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid #e7e0d8;border-radius:12px;padding:20px;margin-bottom:18px}.stat{font:32px Georgia,serif;margin-top:8px}.muted{color:#766d65;font-size:13px}.btn{background:#292521;color:white;border:0;border-radius:8px;padding:11px 16px}.btn.alt{background:#eeeae4;color:#292521}.btn.red{background:#a13c39}.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}input,select,textarea{border:1px solid #d9d2c8;border-radius:7px;padding:10px;width:100%;background:white}label{font-size:12px;color:#625950;display:block;margin-bottom:5px}form .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-bottom:15px}.span{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee7df;font-size:13px}th{color:#7e7062;font-weight:600}tr:last-child td{border:0}.pill{display:inline-block;background:#f0ece6;padding:5px 9px;border-radius:99px;font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{background:white;border:1px solid #e2dcd3;border-radius:9px;padding:12px 5px;min-height:85px;text-align:center}.day.full{background:#fff1ee;border-color:#efbdb5}.day.selected{outline:2px solid #3e3832}.day small{display:block;color:#7b7269;margin-top:9px}.hidden{display:none!important}#notice{position:fixed;right:20px;bottom:20px;background:#292521;color:white;padding:12px 18px;border-radius:9px;max-width:420px;z-index:5}#login{max-width:420px;margin:12vh auto;padding:30px;background:white;border:1px solid #e4dcd1;border-radius:14px}#login h1{font:34px Georgia,serif;letter-spacing:3px}#login input{margin:8px 0 14px}.small{font-size:12px}.right{text-align:right}@media(max-width:950px){aside{position:static;width:100%;padding:12px}aside h1{font-size:19px}aside small{margin-bottom:10px}nav{display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap}main{margin:0;padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.calendar{gap:3px}.day{min-height:72px;padding:8px 2px;font-size:12px}}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr!important}.top{align-items:start;flex-direction:column}table{display:block;overflow-x:auto}.day{font-size:10px;min-height:65px}}

/* GALOIR V3 — tablet-friendly order slip and over-capacity authorization */
.panel.span{grid-column:1/-1;margin:8px 0}
.panel.span .fields{grid-template-columns:repeat(4,minmax(0,1fr))}
.override-box{background:#fff5e8;border:1px solid #c59155;margin:14px 0}
#measurementForm .span .actions label{display:inline-flex;gap:8px;align-items:center}
#measurementForm .fields>.span{min-width:0}
#measurementForm h3{margin-top:0}
#measurementForm .panel{box-shadow:0 1px 2px rgba(30,27,23,.06)}
#measurementForm button{margin-top:4px}
@media(max-width:950px){.panel.span .fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.panel.span .fields{grid-template-columns:1fr}}

/* GALOIR calendar: open dates green; weekends always red, even when Alter slots remain */
.day.available{background:#e0f5e5;border:2px solid #50a765;color:#17552b}
.day.available small{color:#225c35}
.day.full:not(.weekend){background:#fff0d2;border:2px solid #d6a347;color:#764f0d}
.day.full:not(.weekend) small{color:#764f0d}
.day.past:not(.weekend){background:#edebe8;border-color:#d3d0c9;color:#77716c}
.day.past:not(.weekend) small{color:#77716c}
.day.weekend{background:#ffe2e2!important;border:2px solid #d75d65!important;color:#972633!important}
.day.weekend small{color:#972633!important}
.weekend-heading{font-weight:750;color:#af2632}
.day.selected{outline:3px solid #292521;outline-offset:1px}
.day:focus-visible{outline:3px solid #14518d;outline-offset:2px}

/* In-form date calendar: unlike iOS native date picker, these dates can show availability colors */
.colored-date-picker{position:relative;width:100%}
.color-calendar-trigger{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:45px;text-align:left;background:#fff;border:1px solid #d9d2c8;border-radius:8px;padding:10px 12px;color:#28231f}
.color-calendar-trigger span{font-size:20px;line-height:1}
.color-calendar-panel{width:min(370px,100%);max-width:100%;padding:13px 9px 11px;border:1px solid #cfc8bf;border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(32,25,20,.12);margin-top:7px}
.color-calendar-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.color-calendar-heading strong{font-size:15px;font-weight:750}
.color-calendar-heading button{min-width:37px;height:37px;border:1px solid #ddd6ce;border-radius:7px;background:#f7f5f1;font-size:23px;color:#2b2825}
.color-calendar-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:stretch}
.color-calendar-days>span:not(.color-calendar-empty){text-align:center;font-size:11px;font-weight:700;color:#5d544b;padding:4px}
.color-calendar-days>span.weekend-label{color:#a02c35}
.color-calendar-day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:43px;border-radius:7px;padding:4px 1px;font-size:13px;border:1px solid transparent}
.color-calendar-day b{font-weight:750}
.color-calendar-day small{font-size:9px;line-height:1.1;white-space:nowrap}
.color-calendar-day.available{background:#e0f5e5;border-color:#50a765;color:#17552b}
.color-calendar-day.weekend{background:#ffe2e2;border-color:#d75d65;color:#972633}
.color-calendar-day.full:not(.weekend){background:#fff0d2;border-color:#d6a347;color:#764f0d}
.color-calendar-day.past:not(.weekend){background:#edebe8;border-color:#d3d0c9;color:#77716c}
.color-calendar-day.selected{outline:2px solid #292521;outline-offset:-2px}
.color-calendar-day:disabled{cursor:not-allowed;opacity:.65}
.color-calendar-key{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.color-calendar-key .key{padding:4px 7px;border-radius:5px;font-size:10px;font-weight:700}
.color-calendar-key .green{background:#e0f5e5;color:#17552b}
.color-calendar-key .red{background:#ffe2e2;color:#972633}
.color-calendar-key .amber{background:#fff0d2;color:#764f0d}
.color-calendar-key .gray{background:#edebe8;color:#77716c}
.color-calendar-panel .muted{font-size:11px;margin:10px 2px 0}
.billing-success{border:2px solid #4a985f;background:#f0faf2}
.billing-success h3{color:#18572a;font-size:19px}
.billing-success .btn{margin-top:8px;font-weight:750}
.btn.danger-outline{background:#fff;color:#9b3035;border:1px solid #d89ba0}
@media(max-width:430px){.color-calendar-panel{padding:10px 5px}.color-calendar-days{gap:2px}.color-calendar-day{min-height:40px;font-size:12px}.color-calendar-day small{font-size:8px}}

/* Prominent assigned GL measurement slip number on all devices */
.slip-number-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;background:#f3f0e9;border:1.5px solid #b2a797;border-left:5px solid #5f5246;border-radius:10px;padding:15px 18px;margin:12px 0 18px}
.slip-number-label{display:block;letter-spacing:1.1px;font-size:11px;font-weight:800;color:#61574d}
.slip-number-value{display:block;margin-top:4px;font-size:clamp(22px,3vw,29px);line-height:1.15;font-weight:850;letter-spacing:.4px;color:#201d1a;overflow-wrap:anywhere}
.slip-number-help{font-size:12px;color:#554d44;margin:0;max-width:320px;line-height:1.4}
@media(max-width:600px){.slip-number-banner{padding:13px 14px}.slip-number-help{max-width:100%}}

/* Desktop: keep GALOIR branding fixed while left navigation scrolls independently */
@media (min-width:951px){
  #app aside{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  #app aside h1,
  #app aside small{flex-shrink:0}
  #app aside nav{
    display:block;
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding-right:5px;
    scrollbar-width:thin;
    scrollbar-color:#baa998 #302a26;
    scrollbar-gutter:stable;
    overscroll-behavior-y:contain;
  }
  #app aside nav::-webkit-scrollbar{width:9px}
  #app aside nav::-webkit-scrollbar-track{background:#302a26;border-radius:8px}
  #app aside nav::-webkit-scrollbar-thumb{background:#8f7f6f;border:2px solid #302a26;border-radius:8px}
  #app aside nav::-webkit-scrollbar-thumb:hover{background:#baa998}
  #app aside nav button{display:block}
}

/* Preparation lead-time warning */
.preparation-lead-warning{display:block;grid-column:1/-1;margin:5px 0 12px;padding:12px 14px;border:2px solid #b94a42;border-radius:8px;background:#fff0ed;color:#872923;font-weight:700;font-size:14px;line-height:1.5}
.color-calendar-trigger.prep-invalid{border:2px solid #b94a42;box-shadow:0 0 0 2px rgba(185,74,66,.13)}
@media(max-width:560px){.preparation-lead-warning{font-size:13px;padding:10px 12px}}

/* Two daily operational columns: master-room handoff and customer deliveries */
.dashboard-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.dashboard-summary .card{margin:0;min-width:0}
.dashboard-summary .stat{font-size:28px}
.dashboard-summary .stat small{font:12px Inter,system-ui,sans-serif;color:#766d65}
.dashboard-two-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch}
.dashboard-worklist{min-width:0;max-height:72vh;overflow-y:auto;scrollbar-width:thin}
.dashboard-list-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.dashboard-list-heading h3{font-size:19px;margin:0}
.dashboard-list-heading>span{background:#eeeae4;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:750;white-space:nowrap}
.worklist-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid #e8e1d7;min-width:0}
.worklist-row.worklist-checked{background:#f4faf4}
.worklist-entry{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:13px}
.worklist-entry strong{font-size:14px;overflow-wrap:anywhere}
.worklist-entry span{overflow-wrap:anywhere}
.worklist-date{font-size:11px;color:#857263}
.worklist-status{font-size:11px;font-weight:700;color:#397249}
.worklist-check{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:115px;margin:0;color:#28231f;font-size:12px;font-weight:700}
.worklist-check input[type=checkbox]{width:23px;height:23px;accent-color:#247746;cursor:pointer}
.worklist-check input:disabled{cursor:not-allowed}
.dashboard-empty{color:#766d65;padding:24px 5px;text-align:center}
.scan-dashboard-cta{display:flex;align-items:center;justify-content:space-between;gap:18px}
.scan-dashboard-cta h3{margin-bottom:5px}
.scan-dashboard-cta .muted{margin:0}
.ready-scanner-row{display:flex;align-items:center;gap:10px}
.ready-scanner-row input{min-width:0;max-width:430px;flex:1}
.ready-scanner-row button{flex:0 0 auto}
.ready-scanner-panel{max-width:850px}
.scan-success{margin-top:16px;padding:14px;border:1.5px solid #61a777;background:#edfaef;border-radius:10px}
.scan-success strong{color:#226539}
.scan-success p{margin-bottom:0}
@media(max-width:1100px){
.dashboard-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:950px){
.dashboard-two-columns{grid-template-columns:1fr}
.dashboard-worklist{max-height:none}
}
@media(max-width:560px){
.dashboard-summary{gap:8px}
.dashboard-summary .card{padding:12px}
.dashboard-summary .stat{font-size:24px}
.dashboard-list-heading h3{font-size:16px}
.worklist-check{min-width:88px}
.scan-dashboard-cta{flex-direction:column;align-items:stretch}
.ready-scanner-row{flex-direction:column;align-items:stretch}
.ready-scanner-row input{max-width:none}
}

/* Staff-only home dashboard: lookup by phone or GL slip and show operational status */
.status-lookup-panel{margin-bottom:18px}
.status-lookup-panel h3{margin:0 0 8px;font-size:20px}
.status-search-form{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;margin:14px 0}
.status-search-form input[type="search"]{width:100%;min-width:0;max-width:none;height:46px!important;min-height:46px!important;max-height:46px!important;flex:none!important;line-height:22px;padding:10px 13px;font-size:16px;box-sizing:border-box;align-self:center;-webkit-appearance:none;appearance:none}
.status-search-form .btn{white-space:nowrap;min-height:46px}
.status-lookup-message{padding:13px;border:1px solid #d4c0ad;background:#fff8eb;border-radius:9px}
.status-result-count{font-size:13px;font-weight:750;color:#625951;margin:8px 0 12px}
.status-result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.status-result-card{min-width:0;border:1px solid #ddd6ca;border-radius:11px;padding:15px;background:#fff}
.status-result-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid #ede6dd}
.status-result-top>strong{font-size:20px;color:#24201d}
.status-pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-size:12px;line-height:1.25;font-weight:750}
.status-pill.ready{background:#d9f4e2;color:#165b32}
.status-pill.master{background:#deebff;color:#244f8e}
.status-pill.notdue{background:#e9e9ee;color:#474960}
.status-pill.delivered{background:#e1f4d8;color:#356321}
.status-pill.attention{background:#fff2d1;color:#895913}
.status-pill.overdue{background:#ffe0de;color:#962f2b}
.status-pill.draft{background:#f4eada;color:#745633}
.status-result-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 16px;padding:12px 0}
.status-result-details>div{min-width:0}
.status-result-details span{display:block;color:#766d62;font-size:11px;margin-bottom:3px}
.status-result-details strong{display:block;overflow-wrap:anywhere;font-size:14px}
.status-description{margin:4px 0 0;font-size:12px;line-height:1.5;color:#5e554b;border-top:1px dashed #e2dcd4;padding-top:10px}
@media(max-width:950px){.status-result-grid{grid-template-columns:1fr}}
@media(max-width:700px){
 .status-search-form{grid-template-columns:minmax(0,1fr);align-items:stretch}
 .status-search-form input[type="search"]{height:46px!important;min-height:46px!important;max-height:46px!important;align-self:stretch}
 .status-search-form .btn{width:100%}
}
@media(max-width:480px){
 .status-result-top>strong{font-size:18px}
 .status-result-card{padding:12px}
}

/* Dashboard search results: actions and private measurement preview */
.status-result-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #e6dfd6}
.status-result-actions .btn{font-size:12px;padding:9px 12px;white-space:normal;text-align:center}
.status-slip-dialog{width:min(900px,calc(100vw - 28px));max-width:900px;max-height:calc(100dvh - 28px);overflow-y:auto;border:1px solid #c8baac;border-radius:14px;padding:18px 20px;background:#fff;color:#25211e;box-shadow:0 15px 55px rgba(0,0,0,.27);position:fixed}
.status-slip-dialog::backdrop{background:rgba(19,16,14,.67)}
.status-slip-dialog.status-slip-fallback{z-index:1000}
.status-slip-dialog-controls{display:flex;justify-content:space-between;align-items:center;gap:15px;padding-bottom:12px;margin-bottom:13px;border-bottom:1px solid #e1dbd1}
.status-slip-dialog-controls>span{font-size:12px;font-weight:800;letter-spacing:.8px;color:#615951}
.status-preview-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.status-preview-brand{font-size:25px;font-weight:850;letter-spacing:1.3px}
.status-preview-header h3{font-size:20px;margin:4px 0 0}
.status-preview-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;background:#f7f5f1;border-radius:8px;padding:12px;margin-bottom:14px}
.status-preview-meta>div{min-width:0;padding-bottom:6px;border-bottom:1px dotted #c8c0b7}
.status-preview-meta span{display:block;font-size:11px;color:#6e6257;margin-bottom:4px}
.status-preview-meta strong{display:block;font-size:13px;overflow-wrap:anywhere}
.status-preview-measurements{margin:14px 0}
.status-preview-measurements h4{background:#eeeae5;padding:9px 12px;font-size:14px;margin:0}
.status-preview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.status-preview-cell{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px dotted #cfc8bf;min-width:0;padding:8px 7px}
.status-preview-cell span{font-size:13px;overflow-wrap:anywhere}
.status-preview-cell strong{font-size:15px;text-align:right;overflow-wrap:anywhere}
.status-preview-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.status-preview-notes>div{border:1px solid #ccc4b9;border-radius:8px;padding:12px;min-width:0}
.status-preview-notes h4{font-size:14px;margin:0 0 8px}
.status-preview-notes p{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin:0}
@media(max-width:650px){
 .status-result-actions{flex-direction:column;align-items:stretch}
 .status-result-actions .btn{width:100%}
 .status-slip-dialog{padding:12px;width:calc(100vw - 16px);max-height:calc(100dvh - 16px)}
 .status-preview-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
 .status-preview-notes{grid-template-columns:1fr}
 .status-preview-header{align-items:flex-start;flex-direction:column}
}

/* WhatsApp order notifications: payment, consent and admin delivery log */
.payment-balance{min-height:42px;display:flex;align-items:center;padding:10px 13px;border:1px solid #b6cab7;border-radius:8px;background:#f1fbf2;color:#265d31;font-size:20px;font-weight:850;overflow-wrap:anywhere}
.payment-balance.payment-invalid{border:2px solid #bd3d37;background:#fff1f0;color:#9d2c28;font-size:13px}
.whatsapp-optin{border:1px solid #bfd5bf;border-radius:9px;background:#f3fbf3;padding:13px 15px}
.whatsapp-optin label{display:flex;align-items:flex-start;gap:10px;font-weight:700;line-height:1.45;margin:0}
.whatsapp-optin label input{flex:0 0 auto;width:21px!important;height:21px;accent-color:#246b3b;margin-top:1px}
.whatsapp-optin .muted{margin:7px 0 0;font-size:12px}
.whatsapp-settings-panel{border-top:3px solid #407856}
.whatsapp-settings-panel .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.whatsapp-settings-panel .wa-approval{display:flex;align-items:flex-start;gap:10px;background:#fff6e4;border:1px solid #e8cd91;border-radius:8px;padding:13px;margin:15px 0;line-height:1.55;font-size:13px;font-weight:700}
.whatsapp-settings-panel .wa-approval input{width:20px!important;height:20px;margin-top:2px;accent-color:#38704d;flex:0 0 auto}
.wa-count-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:17px 0}
.wa-count-grid>div{border-radius:9px;padding:12px;background:#f5f2ed;text-align:center}
.wa-count-grid strong{display:block;font-size:23px;color:#2a3930}
.wa-count-grid small{display:block;font-size:11px;color:#73685f;font-weight:700}
.whatsapp-settings-panel .table-scroll{overflow-x:auto;max-width:100%}
.whatsapp-settings-panel td{max-width:245px;overflow-wrap:anywhere;font-size:12px}
@media(max-width:520px){.wa-count-grid{gap:6px}.wa-count-grid>div{padding:9px 5px}.wa-count-grid strong{font-size:19px}.whatsapp-settings-panel .actions{gap:7px}.whatsapp-settings-panel .btn{font-size:12px}}

/* Fast entry to a fresh measurement slip on the Dashboard. */
.dashboard-top-actions{display:flex;align-items:center;justify-content:flex-end;margin:0 0 16px}
.dashboard-new-measurement{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:750;min-height:48px;padding:11px 20px;box-shadow:0 2px 7px rgba(41,37,33,.12)}
.dashboard-plus-icon{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border:2px solid currentColor;border-radius:50%;font-size:22px;font-weight:650;line-height:1}
@media(max-width:700px){.dashboard-top-actions{justify-content:stretch}.dashboard-new-measurement{width:100%;font-size:16px}}

/* Migrating historic handwritten orders into live GL slips; Admin / Manager only */
.dashboard-top-actions{flex-wrap:wrap;gap:10px}
.dashboard-manual-action{display:flex;justify-content:flex-end;margin:-7px 0 16px}
.dashboard-manual-action .btn{min-height:44px;padding:10px 18px}
.manual-overview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.manual-overview .card{margin:0;min-width:0;text-align:center;padding:14px 10px}
.manual-overview b{display:block;font-size:28px;font-weight:850;line-height:1.2;margin-bottom:5px}
.manual-overview small{display:block;font-size:12px;line-height:1.4;color:#766d62}
.manual-import-success{padding:12px 16px;margin-bottom:15px;background:#eaf7ea;border:1px solid #7cb590;border-radius:10px;color:#1e6436;font-weight:750}
.manual-import-new .fields,.manual-import-editor .fields{align-items:start}
.manual-import-new details,.manual-import-editor details{margin:18px 0;padding:13px;border:1px solid #ded5c9;border-radius:10px;background:#faf9f7}
.manual-import-new details>summary,.manual-import-editor details>summary{font-weight:750;cursor:pointer;padding:5px}
.manual-measure-group{padding-top:12px}
.manual-measure-group h4{margin:8px 0 14px;padding:8px 10px;background:#ebe7df;border-radius:6px;font-size:14px}
.manual-check{display:flex;align-items:flex-start;gap:10px;font-size:14px;font-weight:700;line-height:1.45}
.manual-check input{width:20px!important;height:20px;min-width:20px;min-height:20px;margin:1px 0 0;accent-color:#286e4b}
.manual-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.manual-heading h3{margin:0}
.manual-heading label{font-size:13px;font-weight:700;flex:1 1 260px;max-width:420px}
.manual-heading input{height:44px;min-height:44px;max-height:44px;font-size:16px}
.manual-import-row{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid #e5ded4;padding:14px 4px;min-width:0}
.manual-import-row-details{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;font-size:13px}
.manual-import-row-details>strong{font-size:16px;overflow-wrap:anywhere}
.manual-import-row-details>span{overflow-wrap:anywhere}
.manual-import-row-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;max-width:330px}
.manual-import-row-actions .btn{font-size:12px;padding:9px 11px}
.manual-badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700}
.manual-badge.warning{background:#fff1d6;color:#8c5b12}
.manual-badge.done{background:#dff3e5;color:#26663e}
@media(max-width:1150px){.manual-overview{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){
 .dashboard-top-actions{flex-direction:column;align-items:stretch}
 .dashboard-manual-action{justify-content:stretch}
 .dashboard-manual-action .btn{width:100%}
 .manual-overview{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .manual-import-row{flex-direction:column;align-items:stretch}
 .manual-import-row-actions{max-width:none;justify-content:stretch}
 .manual-import-row-actions .btn{flex:1 1 100%}
 .manual-heading{align-items:stretch;flex-direction:column}
 .manual-heading label{max-width:none;flex:none}
}

/* Mobile Sales measurement save: prominent confirmation and temporary recovery state. */
.slip-save-bar{display:flex;flex-direction:column;gap:9px;padding:15px;border:1px solid #d9d1c5;border-radius:10px;background:#f8f5ef;margin:12px 0}
.slip-save-bar #saveSlipBtn{font-size:15px;font-weight:800;min-height:46px}
.slip-save-bar #saveSlipBtn:disabled{opacity:.65;cursor:wait}
.slip-save-feedback{font-size:13px;line-height:1.5;border-radius:8px;padding:9px 11px;overflow-wrap:anywhere}
.slip-save-info{color:#615027;background:#fff7df;border:1px solid #e0c98b}
.slip-save-success{color:#246037;background:#e6f7e9;border:1px solid #a0d8ad}
.slip-save-error{color:#9b2e2e;background:#fff0ec;border:1px solid #e8aaa1;font-weight:700}
@media(max-width:700px){
 .slip-save-bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:12;
  border:1.5px solid #b6a797;box-shadow:0 3px 18px rgba(39,34,29,.15);padding:12px;background:#fff}
 .slip-save-bar .actions{display:flex;flex-direction:column;align-items:stretch;gap:8px}
 .slip-save-bar .btn{width:100%;min-height:48px}
 .slip-save-feedback{font-size:12px}
}
