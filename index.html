<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GALOIR | Measurement Studio</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#28231f;background:#f7f5f1}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}aside{position:fixed;inset:0 auto 0 0;width:225px;background:#24201e;color:#fff;padding:26px 15px}aside h1{font-family:Georgia,serif;text-align:center;letter-spacing:4px;font-size:27px;margin:8px 0 2px}aside small{display:block;text-align:center;color:#b5a89a;letter-spacing:2px;margin-bottom:35px;font-size:10px}nav button{width:100%;padding:13px;text-align:left;background:none;border:0;color:#ddd0c4;border-radius:8px;margin-bottom:5px}nav button.active,nav button:hover{background:#474039;color:white}main{margin-left:225px;padding:30px;max-width:1450px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:24px}.eyebrow{color:#9c815f;letter-spacing:2px;font-size:11px;text-transform:uppercase}h2{font:normal 32px Georgia,serif;margin:5px 0}h3{margin:0 0 15px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid #e7e0d8;border-radius:12px;padding:20px;margin-bottom:18px}.stat{font:32px Georgia,serif;margin-top:8px}.muted{color:#766d65;font-size:13px}.btn{background:#292521;color:white;border:0;border-radius:8px;padding:11px 16px}.btn.alt{background:#eeeae4;color:#292521}.btn.red{background:#a13c39}.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}input,select,textarea{border:1px solid #d9d2c8;border-radius:7px;padding:10px;width:100%;background:white}label{font-size:12px;color:#625950;display:block;margin-bottom:5px}form .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-bottom:15px}.span{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee7df;font-size:13px}th{color:#7e7062;font-weight:600}tr:last-child td{border:0}.pill{display:inline-block;background:#f0ece6;padding:5px 9px;border-radius:99px;font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{background:white;border:1px solid #e2dcd3;border-radius:9px;padding:12px 5px;min-height:85px;text-align:center}.day.full{background:#fff1ee;border-color:#efbdb5}.day.selected{outline:2px solid #3e3832}.day small{display:block;color:#7b7269;margin-top:9px}.hidden{display:none!important}#notice{position:fixed;right:20px;bottom:20px;background:#292521;color:white;padding:12px 18px;border-radius:9px;max-width:420px;z-index:5}#login{max-width:420px;margin:12vh auto;padding:30px;background:white;border:1px solid #e4dcd1;border-radius:14px}#login h1{font:34px Georgia,serif;letter-spacing:3px}#login input{margin:8px 0 14px}.small{font-size:12px}.right{text-align:right}@media(max-width:950px){aside{position:static;width:100%;padding:12px}aside h1{font-size:19px}aside small{margin-bottom:10px}nav{display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap}main{margin:0;padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.calendar{gap:3px}.day{min-height:72px;padding:8px 2px;font-size:12px}}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr!important}.top{align-items:start;flex-direction:column}table{display:block;overflow-x:auto}.day{font-size:10px;min-height:65px}}
</style></head><body><div id="login"><h1>GALOIR</h1><p class="muted">Measurement & Delivery Studio · Secure Staff Login</p><div id="setupWarning" class="muted"></div><form id="loginForm"><label>Email</label><input type="email" id="email" autocomplete="username" required><label>Password</label><input type="password" id="password" autocomplete="current-password" required><button class="btn" style="width:100%">Sign in</button></form><p class="muted">Accounts are created by your GALOIR administrator.</p></div><div id="app" class="hidden"><aside><h1>GALOIR</h1><small>MEASUREMENT STUDIO</small><nav id="nav"></nav></aside><main><div class="top"><div><div class="eyebrow" id="subtitle">STORE OPERATIONS</div><h2 id="heading">Dashboard</h2></div><div class="actions"><span id="who" class="pill"></span><button id="logout" class="btn alt">Sign out</button></div></div><div id="view"></div></main></div><div id="notice" class="hidden"></div><script src="/config.js"></script><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.GALOIR_CONFIG||{};const ready=cfg.supabaseUrl?.startsWith('https://')&&cfg.supabaseAnonKey&&!cfg.supabaseAnonKey.startsWith('REPLACE_');
const sb=ready?createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateStr=d=>{let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const today=dateStr(new Date());let me=null,role=null,tab='dashboard',customers=[],measurements=[],orders=[],profiles=[],capacity=20,month=new Date(),selectedDate=today;
const allowed={admin:['dashboard','customers','measurements','calendar','daily','tailoring','settings','staff','reports'],manager:['dashboard','customers','measurements','calendar','daily','tailoring','settings','reports'],sales:['dashboard','customers','measurements','calendar','daily'],tailoring:['dashboard','customers','measurements','daily','tailoring']};
const titles={dashboard:'Dashboard',customers:'Customers',measurements:'Measurements',calendar:'Delivery Calendar',daily:'Daily Deliveries',tailoring:'Tailoring Board',settings:'Capacity Settings',staff:'Staff Management',reports:'Reports'};
const can=a=>({admin:['customers','measurements','bookings','daily','tailoring','capacity','reports','staff'],manager:['customers','measurements','bookings','daily','tailoring','capacity','reports'],sales:['customers','measurements','bookings','daily'],tailoring:['daily','tailoring']}[role]||[]).includes(a);
function notify(s){$('notice').textContent=s;$('notice').classList.remove('hidden');setTimeout(()=>$('notice').classList.add('hidden'),4500)}
function error(e){notify('Error: '+(e?.message||e));console.error(e)}
async function query(table,fields='*'){const {data,error:e}=await sb.from(table).select(fields);if(e)throw e;return data||[]}
async function refresh(){const [a,b,c,d]=await Promise.all([query('customers'),query('measurements'),query('orders'),query('settings')]);customers=a;measurements=b;orders=c;capacity=d[0]?.daily_capacity||20;if(role==='admin')profiles=await query('profiles');render()}
function customerName(id){return customers.find(x=>x.id===id)?.full_name||'Customer'}
function countDate(d){return orders.filter(x=>x.delivery_date===d).length}
function render(){if(!role)return;const menu=allowed[role]||[];if(!menu.includes(tab))tab=menu[0]||'daily';$('heading').textContent=titles[tab];$('who').textContent=`${esc(me.email)} · ${role}`;$('nav').innerHTML=menu.map(x=>`<button data-tab="${x}" class="${tab===x?'active':''}">${titles[x]}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});const f={dashboard:dashboardView,customers:customersView,measurements:measurementsView,calendar:calendarView,daily:dailyView,tailoring:tailoringView,settings:settingsView,staff:staffView,reports:reportsView};$('view').innerHTML=f[tab]();bind()}
function dashboardView(){const due=orders.filter(o=>o.delivery_date===today),pending=orders.filter(o=>o.status!=='delivered');return `<div class="grid">${[['Customers',customers.length],['Today’s deliveries',due.length],['Pending outfits',pending.length],['Available today',Math.max(0,capacity-countDate(today))]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div><div class="panel"><h3>Today's delivery schedule</h3>${ordersTable(due)}</div><div class="panel"><h3>Pending tailoring work</h3>${ordersTable(pending.slice(0,20))}</div>`}
function ordersTable(rows){return `<table><thead><tr><th>Customer</th><th>Outfit</th><th>Delivery</th><th>Status</th></tr></thead><tbody>${rows.length?rows.map(o=>`<tr><td>${esc(customerName(o.customer_id))}</td><td>${esc(o.item_name)}</td><td>${esc(o.delivery_date)}</td><td><span class="pill">${esc(o.status)}</span></td></tr>`).join(''):'<tr><td colspan="4">No records</td></tr>'}</tbody></table>`}
function customerOptions(){return customers.map(c=>`<option value="${c.id}">${esc(c.full_name)} — ${esc(c.phone)}</option>`).join('')}
function customersView(){return `${can("customers") ? `<div class="panel"><h3>Add customer</h3><form id="customerForm"><div class="fields"><div><label>Full name</label><input name="full_name" required maxlength="120"></div><div><label>Phone</label><input name="phone" required maxlength="30"></div><div class="span"><label>Notes</label><textarea name="notes" rows="2"></textarea></div></div><button class="btn">Save Customer</button></form></div>` : ""}<div class="panel"><h3>Customer profiles</h3><input id="searchCustomers" placeholder="Search by name or phone"><div id="customerRows">${customerTable(customers)}</div></div>`}
function customerTable(rows){return `<table><tr><th>Name</th><th>Phone</th><th>Measurements</th></tr>${rows.map(c=>`<tr><td>${esc(c.full_name)}</td><td>${esc(c.phone)}</td><td>${measurements.filter(m=>m.customer_id===c.id).length}</td></tr>`).join('')}</table>`}
const fields=['Bust','Waist','Hip','Shoulder','Armhole','Sleeve Length','Sleeve Round','Bicep','Neck Front','Neck Back','Top Length','Bottom Waist','Bottom Hip','Bottom Length'];
function measurementsView(){return `${can("measurements") ? `<div class="panel"><h3>Record measurements (inches)</h3><form id="measurementForm"><div class="fields"><div class="span"><label>Customer</label><select name="customer_id" required>${customerOptions()}</select></div>${fields.map(f=>`<div><label>${f}</label><input type="number" min="0" max="150" step="0.1" name="m_${f.replaceAll(' ','_')}"></div>`).join('')}<div class="span"><label>Fitting instructions</label><textarea name="fitting_notes"></textarea></div></div><button class="btn" ${!customers.length?'disabled':''}>Save Measurement Revision</button></form></div>` : ""}<div class="panel"><h3>Recent measurement records</h3><table><tr><th>Customer</th><th>Recorded</th><th>Notes</th><th>Details</th></tr>${measurements.slice().sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,40).map(m=>`<tr><td>${esc(customerName(m.customer_id))}</td><td>${esc(new Date(m.created_at).toLocaleDateString())}</td><td>${esc(m.fitting_notes)}</td><td><details><summary>View</summary><pre>${esc(JSON.stringify(m.values,null,2))}</pre></details></td></tr>`).join('')}</table></div>`}
function calendarView(){const year=month.getFullYear(),mo=month.getMonth(),first=new Date(year,mo,1).getDay(),days=new Date(year,mo+1,0).getDate();let cells=Array(first).fill('<div></div>');for(let n=1;n<=days;n++){const d=dateStr(new Date(year,mo,n)),cnt=countDate(d);cells.push(`<button class="day ${cnt>=capacity?'full':''} ${selectedDate===d?'selected':''}" data-date="${d}"><strong>${n}</strong><small>${Math.max(0,capacity-cnt)} / ${capacity} free</small></button>`)}return `<div class="panel"><div class="top"><h3>${month.toLocaleString('en-IN',{month:'long',year:'numeric'})}</h3><div class="actions"><button class="btn alt" id="prevMonth">Previous</button><button class="btn alt" id="nextMonth">Next</button></div></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="muted right">${x}</div>`).join('')}${cells.join('')}</div></div><div class="panel"><h3>Book delivery — ${esc(selectedDate)}</h3><p class="muted">${countDate(selectedDate)} of ${capacity} slots booked. Each outfit uses one slot.</p>${can('bookings')?`<form id="bookingForm"><div class="fields"><div><label>Customer</label><select name="customer_id" id="bookingCustomer" required>${customerOptions()}</select></div><div><label>Outfit</label><input name="item_name" placeholder="e.g. Suit" required></div><div><label>Delivery date</label><input type="date" name="delivery_date" min="${today}" value="${selectedDate}" required></div><div><label>Measurement revision</label><select name="measurement_id" id="bookingMeasurement"><option value="">None</option></select></div><div class="span"><label>Notes</label><textarea name="notes"></textarea></div></div><button class="btn" ${!customers.length||countDate(selectedDate)>=capacity||selectedDate<today?'disabled':''}>Book Delivery</button></form>`:'<p>You have read-only calendar access.</p>'}</div><div class="panel"><h3>Scheduled outfits</h3>${ordersTable(orders.filter(o=>o.delivery_date===selectedDate))}</div>`}
function dailyView(){return `<div class="panel"><h3>Daily delivery list</h3><div class="actions"><label>Choose date <input id="dailyDate" type="date" value="${selectedDate}"></label></div>${ordersTable(orders.filter(o=>o.delivery_date===selectedDate))}</div><div class="panel"><h3>Overdue and pending work</h3>${ordersTable(orders.filter(o=>o.delivery_date<today&&o.status!=='delivered'))}</div>`}
function tailoringView(){const statuses=['pending','stitching','trial','alteration','ready','delivered'];return `<div class="panel"><h3>Update tailoring progress</h3><table><tr><th>Customer</th><th>Outfit</th><th>Due</th><th>Status</th></tr>${orders.filter(o=>o.status!=='delivered').map(o=>`<tr><td>${esc(customerName(o.customer_id))}</td><td>${esc(o.item_name)}</td><td>${esc(o.delivery_date)}</td><td><select data-status="${o.id}">${statuses.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`}
function settingsView(){return `<div class="panel"><h3>Delivery capacity</h3><p>Current limit: <strong>${capacity} outfits per day</strong>.</p><form id="capacityForm"><label>Daily capacity</label><input name="capacity" type="number" min="1" max="1000" value="${capacity}" required style="max-width:220px"><p><button class="btn">Save Capacity</button></p></form></div>`}
function staffView(){return `<div class="panel"><h3>Manage existing Supabase users</h3><p class="muted">First create a verified login in Supabase Authentication → Users. Copy the User UID here to assign access.</p><form id="staffForm"><div class="fields"><div><label>Full name</label><input name="full_name" required></div><div><label>Supabase Auth User UID</label><input name="user_id" required placeholder="UID from Authentication → Users"></div><div><label>Role</label><select name="role"><option value="sales">Sales</option><option value="tailoring">Tailoring</option><option value="manager">Manager</option><option value="admin">Admin</option></select></div></div><button class="btn">Save Staff Role</button></form></div><div class="panel"><h3>Staff access</h3><table><tr><th>Name / Email</th><th>Role</th><th>Active</th><th>Action</th></tr>${profiles.map(p=>`<tr><td>${esc(p.full_name)}<br><span class="muted">${esc(p.email)}</span></td><td><select data-role="${p.id}">${['sales','tailoring','manager','admin'].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${r}</option>`).join('')}</select></td><td><input type="checkbox" data-active="${p.id}" ${p.active?'checked':''} style="width:auto"></td><td><button class="btn alt" data-save-staff="${p.id}">Save</button></td></tr>`).join('')}</table></div>`}
function reportsView(){return `<div class="grid">${[['Total customers',customers.length],['Total orders',orders.length],['Delivered',orders.filter(o=>o.status==='delivered').length],['Open',orders.filter(o=>o.status!=='delivered').length]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div>`}
async function staffCall(payload){const p=payload.action==='update'?profiles.find(x=>x.id===payload.id):null;const {error:e}=await sb.rpc('admin_set_staff',{p_user_id:payload.action==='update'?payload.id:payload.user_id,p_role:payload.role,p_full_name:p?p.full_name:payload.full_name,p_active:payload.action==='update'?payload.active:true});if(e)throw e;return {ok:true}}
function bind(){const on=(id,event,fn)=>{const el=$(id);if(el)el.addEventListener(event,fn)};
on('customerForm','submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const {error:x}=await sb.from('customers').insert({full_name:f.get('full_name'),phone:f.get('phone'),notes:f.get('notes'),created_by:me.id});if(x)throw x;notify('Customer saved');await refresh()}catch(x){error(x)}});
on('searchCustomers','input',e=>{$('customerRows').innerHTML=customerTable(customers.filter(c=>(c.full_name+' '+c.phone).toLowerCase().includes(e.target.value.toLowerCase())))});
on('measurementForm','submit',async e=>{e.preventDefault();const f=new FormData(e.target),vals={};for(const k of fields){const v=f.get('m_'+k.replaceAll(' ','_'));if(v!=='')vals[k]=Number(v)}try{const {error:x}=await sb.from('measurements').insert({customer_id:f.get('customer_id'),values:vals,fitting_notes:f.get('fitting_notes'),created_by:me.id});if(x)throw x;notify('Measurements saved');await refresh()}catch(x){error(x)}});
on('prevMonth','click',()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()});on('nextMonth','click',()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()});document.querySelectorAll('[data-date]').forEach(el=>el.onclick=()=>{selectedDate=el.dataset.date;render()});
const bookingCustomer=$('bookingCustomer'),bookingMeasurement=$('bookingMeasurement');if(bookingCustomer&&bookingMeasurement){const update=()=>{bookingMeasurement.innerHTML='<option value="">None</option>'+measurements.filter(m=>m.customer_id===bookingCustomer.value).map(m=>`<option value="${m.id}">${esc(new Date(m.created_at).toLocaleString())}</option>`).join('')};bookingCustomer.onchange=update;update()}
on('bookingForm','submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const {error:x}=await sb.rpc('book_order',{p_customer_id:f.get('customer_id'),p_measurement_id:f.get('measurement_id')||null,p_item_name:f.get('item_name'),p_delivery_date:f.get('delivery_date'),p_notes:f.get('notes')});if(x)throw x;notify('Delivery booked');await refresh()}catch(x){error(x)}});
on('dailyDate','change',e=>{selectedDate=e.target.value;render()});document.querySelectorAll('[data-status]').forEach(el=>el.onchange=async()=>{try{const {error:x}=await sb.rpc('set_order_status',{p_order_id:el.dataset.status,p_status:el.value});if(x)throw x;notify('Status updated');await refresh()}catch(x){error(x)}});
on('capacityForm','submit',async e=>{e.preventDefault();try{const {error:x}=await sb.rpc('set_capacity',{p_capacity:Number(new FormData(e.target).get('capacity'))});if(x)throw x;notify('Capacity updated');await refresh()}catch(x){error(x)}});
on('staffForm','submit',async e=>{e.preventDefault();try{const f=new FormData(e.target);await staffCall({action:'create',user_id:f.get('user_id'),full_name:f.get('full_name'),role:f.get('role')});notify('Staff role saved');await refresh()}catch(x){error(x)}});
document.querySelectorAll('[data-save-staff]').forEach(el=>el.onclick=async()=>{const id=el.dataset.saveStaff;try{await staffCall({action:'update',id,role:document.querySelector(`[data-role="${id}"]`).value,active:document.querySelector(`[data-active="${id}"]`).checked});notify('Staff updated');await refresh()}catch(x){error(x)}})
}
async function loadUser(){const {data:{user}}=await sb.auth.getUser();if(!user){me=null;role=null;$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const {data:p,error:e}=await sb.from('profiles').select('*').eq('id',user.id).single();if(e||!p?.active){await sb.auth.signOut();notify('Account is not authorized. Contact your admin.');return loadUser()}me=user;role=p.role;$('login').classList.add('hidden');$('app').classList.remove('hidden');try{await refresh()}catch(x){error(x)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();if(!sb)return notify('Configure Supabase first');const {error:x}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(x)return error(x);await loadUser()};$('logout').onclick=async()=>{await sb.auth.signOut();loadUser()};if(!ready){$('setupWarning').textContent='Setup required: configure config.js with your Supabase Project URL and public key before signing in.'}else loadUser();
</script></body></html>
